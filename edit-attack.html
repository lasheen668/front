<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attack Report</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="attacks.html">Report Attack</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <h1>Edit Attack Report</h1>
            <form id="editAttackForm">
                <div class="form-group">
                    <label for="attackType">Attack Type:</label>
                    <select id="attackType" required>
                        <option value="">-- Select Type --</option>
                        <option value="Defenders">Defenders</option>
                        <option value="Defenders 1">Defenders 1</option>
                        <option value="Midfielders">Midfielders</option>
                        <option value="Attackers">Attackers</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" rows="5" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Report</button>
                    <a href="attacks.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
            <div id="message" class="message"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Attack Reporting System</p>
    </footer>

    <script src="js/edit-attack.js"></script>
</body>
</html>
